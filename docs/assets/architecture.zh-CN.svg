  font-weight: 700;
}

.node rect,
.node polygon,
.node path {
  filter: none;
}

.node rect {
  rx: 10px;
  ry: 10px;
}

.node.section rect {
  filter: none;
}

.node[id$="-undefined"] {
  display: none;
}

.node.bus rect {
  height: 64px;
  y: -32px;
  rx: 12px;
  ry: 12px;
}

