      GRAPH_EXTRACTION_LOCAL_ENDPOINT: ${GRAPH_EXTRACTION_LOCAL_ENDPOINT:-false}
      GRAPH_EXTRACTION_REMOTE_EVIDENCE_ALLOWED: ${GRAPH_EXTRACTION_REMOTE_EVIDENCE_ALLOWED:-false}
