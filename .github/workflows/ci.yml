name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  python-contracts:
    name: Python contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - name: Install Community Worker test dependencies
        working-directory: worker
        run: python -m pip install -e ".[test]"
      - name: Test Community Worker
        working-directory: worker
        run: pytest -q
      - name: Test MinerU image contract
        run: python -m unittest discover mineru/tests -v
      - name: Validate Compose configuration
        run: docker compose config --quiet

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: test
          tags: rag-platform-backend-test:ci
          load: true
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,scope=backend-test,mode=max
      - name: Prepare OpenSearch host settings
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Start test dependencies
        run: docker compose --profile test up -d --wait postgres-test opensearch-test minio
      - name: Maven tests and JaCoCo gates
        run: |
          mkdir -p backend/target
          docker run --rm \
            --network rag-platform_default \
            -e DB_URL=jdbc:postgresql://postgres-test:5432/rag_test \
            -e DB_USERNAME=rag_test \
            -e DB_PASSWORD=rag_test \
            -e SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=4 \
            -e SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=0 \
            -e SESSION_COOKIE_SECURE=false \
            -e MINIO_ENDPOINT=http://minio:9000 \
            -e MINIO_ACCESS_KEY=ragminio \
            -e MINIO_SECRET_KEY=ragminio123 \
            -e MINIO_BUCKET=rag-documents-test \
            -e STORAGE_ORPHAN_RETENTION=PT0S \
            -e STORAGE_CLEANUP_DELAY_MS=60000 \
            -e SEARCH_ENABLED=true \
            -e OPENSEARCH_URL=http://opensearch-test:9200 \
            -e SEARCH_PROJECTION_DELAY_MS=3600000 \
            -e EMBEDDING_ENABLED=false \
            -e RERANK_ENABLED=false \
            -e LLM_ENABLED=false \
            -e GRAPH_EXTRACTION_ENABLED=false \
            -e EVALUATION_REAL_ENABLED=false \
            -e RUN_PHASE6C_QUALITY=false \
            -e RUN_PHASE6C_BENCHMARK=false \
            -e RUN_PHASE7A_BENCHMARK=false \
            -v "$PWD/backend/target:/workspace/target" \
            rag-platform-backend-test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
          if-no-files-found: ignore
      - name: Tear down test services
        if: always()
        run: docker compose --profile test down -v --remove-orphans
