[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-worker"
version = "0.1.0"
description = "Worker service for the RAG platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.2",
    "igraph==0.11.9",
    "leidenalg==0.10.2",
    "uvicorn==0.51.0",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
cache_dir = "/tmp/rag-worker-pytest-cache"
